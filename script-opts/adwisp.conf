# Copy to ~/.config/mpv/script-opts/adwisp.conf
seek_step=5
# Volume change per Ctrl+Up / Ctrl+Down press
volume_step=5
# Playback-speed change per Ctrl+Alt+Up / Ctrl+Alt+Down press
speed_step=0.1
# Loop, A-B repeat, and screenshot key bindings
loop_toggle_key=CTRL+ALT+L
ab_loop_key=CTRL+ALT+A
screenshot_key=CTRL+ALT+S
# Core keyboard bindings; invalid/conflicting values fall back to defaults
toggle_key=g
dismiss_key=q
dismiss_escape_key=ESC
seek_back_key=LEFT
seek_forward_key=RIGHT
volume_up_key=CTRL+UP
volume_down_key=CTRL+DOWN
mute_toggle_key=m
playlist_prev_key=CTRL+LEFT
playlist_next_key=CTRL+RIGHT
# Set to no to disable optional thumbfast timeline previews
thumbnail_preview=yes
# Existing directory for exported thumbfast preview BMP files
thumbnail_export_directory=~~/
# Filename prefix for exported thumbfast preview BMP files
thumbnail_export_prefix=adwisp-thumbnail
# Minimum interval in seconds between playback-position OSD rebuilds
time_pos_render_interval=0.15
# Collapse the timeline to a progress-only line until hovered or focused
minimal_timeline=no
# OSD placement: bottom, top, or custom
osd_position=bottom
# Optional split title/status top zone and playback bottom zone
control_zones=single
# Top edge margin for split-zone title/status panel
top_zone_margin=24
# Each split zone can remain visible or appear only while hovered/focused
top_zone_visibility=always
bottom_zone_visibility=always
# Edge margin in pixels; -1 keeps the responsive default
osd_margin=-1
# Top-origin vertical offset in pixels when osd_position=custom
osd_custom_offset=120
# Font family (letters, numbers, spaces, hyphens, and underscores)
font_family=Sans
# Font scale from 0.75 to 1.25
font_scale=1.0
# Auto-hide after this many seconds of inactivity; 0 disables it
idle_hide_timeout=0
# Fade duration in seconds (0.05–1.0)
fade_duration=0.25
# Logging verbosity: quiet, info, or debug
log_level=info
# Optional palette file path (Matugen-compatible key=value, #RRGGBB)
theme_file=
# Optional UTF-8 key=value translation file; missing keys use English
locale_file=

# Optional local-only recently played history (disabled by default)
recent_history=no
# Number of local entries to retain (1–100)
recent_history_limit=20
# Playback progress shares the existing opt-in recent-history file
# JSON history file path; stored locally and never synced
recent_history_file=~~/adwisp-recent.json
# Local JSON overrides for seek, volume, thumbnail, and theme preferences
preferences_file=~~/adwisp-preferences.json
# Maximum number of entries to inspect in one opened library folder
library_max_entries=500

# Local JSON file for configured video-library roots and pinned folders
library_config_file=~~/adwisp-library.json
