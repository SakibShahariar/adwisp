# Copy to ~/.config/mpv/script-opts/adwisp.conf
seek_step=5
# Volume change per Ctrl+Up / Ctrl+Down press
volume_step=5
# Playback-speed change per Ctrl+Alt+Up / Ctrl+Alt+Down press
speed_step=0.1
# Set to no to disable optional thumbfast timeline previews
thumbnail_preview=yes
# Minimum interval in seconds between playback-position OSD rebuilds
time_pos_render_interval=0.15
# OSD placement: bottom, top, or custom
osd_position=bottom
# Edge margin in pixels; -1 keeps the responsive default
osd_margin=-1
# Top-origin vertical offset in pixels when osd_position=custom
osd_custom_offset=120
# Font family (letters, numbers, spaces, hyphens, and underscores)
font_family=Sans
# Font scale from 0.75 to 1.25
font_scale=1.0
# Logging verbosity: quiet, info, or debug
log_level=info
# Optional palette file path (Matugen-compatible key=value, #RRGGBB)
theme_file=
