name: Commit message check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional-commits:
    name: Validate Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Check every pull request commit
        uses: actions/github-script@v7
        with:
          script: |
            const pull_number = context.payload.pull_request.number;
            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number,
                per_page: 100,
              }
            );

            const allowedTypes = new Set([
              "feat", "fix", "docs", "style", "refactor", "perf",
              "test", "build", "ci", "chore", "revert"
            ]);
            const pattern = /^([a-z]+)(\([^)]+\))?(!)?: .+$/;
            const invalid = [];

            for (const commit of commits) {
              const message = commit.commit.message.split("\n", 1)[0];
              if (message.startsWith("Merge ")) continue;
              const match = message.match(pattern);
              if (!match || !allowedTypes.has(match[1])) {
                invalid.push({ sha: commit.sha.slice(0, 7), message });
              }
            }

            if (invalid.length) {
              core.setFailed(
                "Commit messages must follow Conventional Commits, e.g. " +
                "'feat(renderer): add playback controls'. Invalid commits:\n" +
                invalid.map(c => "- " + c.sha + " " + c.message).join("\n")
              );
            } else {
              core.info("All pull request commits follow the configured convention.");
            }
