name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Validate and publish release archive
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Lua 5.2 and LuaRocks
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential liblua5.2-dev lua5.2 luarocks
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(command -v lua5.2)" "$HOME/.local/bin/lua"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install luacheck
        run: |
          LUA_INCDIR=/usr/include/lua5.2 luarocks --lua-version=5.2 --lua-dir=/usr install --local luacheck
          eval "$(luarocks --lua-version=5.2 path)"
          echo "LUA_PATH=$LUA_PATH" >> "$GITHUB_ENV"
          echo "LUA_CPATH=$LUA_CPATH" >> "$GITHUB_ENV"
          echo "$HOME/.luarocks/bin" >> "$GITHUB_PATH"

      - name: Check Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          find adwisp.lua core tests -type f -name '*.lua' -print0 |
            while IFS= read -r -d '' file; do
              luac5.2 -p "$file"
            done

      - name: Run Luacheck
        run: luacheck adwisp.lua core tests --no-color

      - name: Run unit tests
        run: |
          lua5.2 tests/test_layout.lua
          lua5.2 tests/test_adwisp.lua
          lua5.2 tests/test_renderer.lua
          lua5.2 tests/test_theme.lua
          lua5.2 tests/test_bmp.lua
          lua5.2 tests/test_menu_filter.lua
          lua5.2 tests/test_recent_history.lua
          lua5.2 tests/test_i18n.lua

      - name: Build release archive
        run: |
          bash scripts/package.sh "$GITHUB_REF_NAME" dist
          archive="dist/adwisp-$GITHUB_REF_NAME.zip"
          archive_contents=$(unzip -Z1 "$archive")
          for path in \
            scripts/adwisp/adwisp.lua \
            scripts/adwisp/core/bmp.lua \
            scripts/adwisp/core/layout.lua \
            scripts/adwisp/core/renderer.lua \
            scripts/adwisp/core/state.lua \
            scripts/adwisp/core/theme.lua \
            script-opts/adwisp.conf; do
            printf '%s\n' "$archive_contents" | grep -Fx "$path"
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/adwisp-$GITHUB_REF_NAME.zip" \\
            --title "Adwisp $GITHUB_REF_NAME" --generate-notes
