name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua-checks:
    name: Lua syntax and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Lua
        uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.2"

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Install luacheck
        run: luarocks install luacheck

      - name: Check Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          find adwisp.lua core tests -type f -name '*.lua' -print0 |
            while IFS= read -r -d '' file; do
              luac -p "$file"
            done

      - name: Run Luacheck
        run: luacheck adwisp.lua core tests --no-color

      - name: Run unit tests
        run: lua tests/test_layout.lua
